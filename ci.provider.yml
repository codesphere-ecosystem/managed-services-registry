schemaVersion: v0.4
prepare:
  steps: []
test:
  steps: []
run:
  provider:
    healthEndpoint: http://localhost:8080/health
    plan: 201
    replicas: 1
    image: ghcr.io/codesphere-ecosystem/managed-services-registry:v1.0.1 # x-release-please-version
    network:
      ports:
        - port: 8080
          isPublic: false
      paths:
        - port: 8080
          path: /
    env:
      API_KEY: ${{ vault.HARBOR_PROVIDER_API_KEY }}
      HARBOR_URL: ${{ workspace.env.HARBOR_URL }}
      HARBOR_USERNAME: ${{ vault.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ vault.HARBOR_PASSWORD }}
