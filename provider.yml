name: harbor
schemaVersion: v1
author: Codesphere
displayName: Harbor
iconUrl: https://github.com/goharbor/harbor/blob/main/docs/img/harbor_logo.png?raw=true
category: registry
description: |
  Harbor project provisioning backed by the managed-services registry adapter.

  Each service instance creates one Harbor project and one Harbor
  project-scoped robot account with full project privileges.

  The selected plan's `parameters.storage` value is used as the Harbor
  project storage quota in MiB.
backend:
  api:
    endpoint: https://2403471-3000.1.csa.codesphere-demo.com/api/v1/harbor
    # secret: Bearer your-api-key
configSchema:
  type: object
  properties:
    public:
      type: boolean
      description: Whether the Harbor project should be publicly visible.
      default: false
  additionalProperties: false
secretsSchema:
  type: object
  properties:
    superuserPassword:
      type: string
      format: password
      description: Secret for the Harbor robot account created for this service.
  required: ['superuserPassword']
detailsSchema:
  type: object
  properties:
    ready:
      type: boolean
    projectName:
      type: string
    username:
      type: string
    harborUrl:
      type: string
      format: uri
    registryUrl:
      type: string
      format: uri
    usedStorage:
      type: integer
    usedStoragePercent:
      type: number
  required: ['ready']
resourceParameters:
  storage:
    pricedAs: storage-mib
    schema:
      type: integer
      minimum: 1
      x-update-constraint: increase-only
  cpu:
    pricedAs: cpu-tenths
    schema: { type: number, readOnly: true }
  memory:
    pricedAs: ram-mib
    schema: { type: integer, readOnly: true }
plans:
  - id: 0
    name: Default
    description: Harbor project with a configurable storage quota.
    parameters: { storage: 10240, cpu: 0, memory: 0 }
